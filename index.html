<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Diagnóstico de anuncios inmobiliarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
      max-width: 720px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 12px;
      font-size: 16px;
    }
    button {
      margin-top: 12px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #resultado {
      margin-top: 24px;
      white-space: pre-wrap;
      border-top: 1px solid #ddd;
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <h1>Diagnóstico de anuncios inmobiliarios</h1>

  <p>Pega aquí el texto de tu anuncio:</p>

  <textarea id="texto" placeholder="Ej: Piso luminoso en el centro de Barcelona..."></textarea>

  <br />

  <button onclick="analizar()">Analizar anuncio</button>

  <div id="resultado"></div>

  <script>
    async function analizar() {
      const texto = document.getElementById("texto").value;
      const resultado = document.getElementById("resultado");

      if (!texto.trim()) {
        resultado.innerText = "❌ Escribe un texto primero.";
        return;
      }

      resultado.innerText = "⏳ Analizando anuncio...";

      try {
        const res = await fetch("/diagnostico", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ texto }),
        });

        const data = await res.json();

        if (data.error) {
          resultado.innerText = "❌ " + data.error;
        } else {
          resultado.innerText = data.resultado;
        }
      } catch (e) {
        resultado.innerText = "❌ Error de conexión con el servidor.";
      }
    }
  </script>

</body>
</html>
