<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clínica de Anuncios Inmobiliarios</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      line-height: 1.5;
    }
    h1 { margin-bottom: 10px; }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 16px;
    }
    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
    }
    #resultado {
      margin-top: 30px;
      padding: 20px;
      background: #f4f4f4;
    }
  </style>
</head>
<body>

<h1>Clínica de Anuncios Inmobiliarios</h1>
<p>
Descubre si tu anuncio se está vendiendo… o solo lo están mirando.
</p>

<p><strong>Abre tu anuncio en Idealista y copia aquí los datos que ves.</strong><br>
Son los mismos datos que usa el portal para decidir si tu anuncio se muestra o no.</p>

<input id="visitas" type="number" placeholder="Visitas">
<input id="guardados" type="number" placeholder="Veces guardado">
<input id="contactos" type="number" placeholder="Contactos recibidos">
<input id="dias" type="number" placeholder="Días publicado">

<button onclick="analizar()">Ver diagnóstico</button>

<div id="resultado"></div>

<script>
async function analizar() {
  const data = {
    visitas: visitas.value,
    guardados: guardados.value,
    contactos: contactos.value,
    dias: dias.value
  };

  const res = await fetch("/analizar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const r = await res.json();

  document.getElementById("resultado").innerHTML = `
    <h2>${r.estado}</h2>
    <p>${r.mensaje}</p>
    <p><em>Este análisis refleja cómo está reaccionando la gente a tu anuncio hoy.</em></p>
    <p><strong>Si quieres, puedo ayudarte a entender qué tocar primero y qué no.</strong></p>
  `;
}
</script>

</body>
</html>
