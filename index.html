<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Diagnóstico de anuncios inmobiliarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 24px;
      color: #111;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    button {
      margin-top: 16px;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #resultado {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      background: #f5f5f5;
      white-space: pre-wrap;
    }

    .loading {
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <h1>Diagnóstico de anuncios inmobiliarios</h1>
  <p>Pega aquí el texto de tu anuncio:</p>

  <textarea id="texto"></textarea>
  <br />
  <button id="btn" onclick="analizar()">Analizar anuncio</button>

  <div id="resultado"></div>

  <script>
    async function analizar() {
      const texto = document.getElementById("texto").value;
      const resultado = document.getElementById("resultado");
      const btn = document.getElementById("btn");

      if (texto.trim().length < 20) {
        resultado.innerText = "❌ El texto es demasiado corto.";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Analizando...";
      resultado.classList.add("loading");
      resultado.innerText = "";

      try {
        const response = await fetch("/diagnostico", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto }),
        });

        const data = await response.json();

        if (data.error) {
          resultado.innerText = "❌ " + data.error;
        } else {
          resultado.innerText = data.resultado;
        }
      } catch (err) {
        resultado.innerText = "❌ Error de conexión con el servidor.";
      }

      btn.disabled = false;
      btn.innerText = "Analizar anuncio";
      resultado.classList.remove("loading");
    }
  </script>

</body>
</html>
