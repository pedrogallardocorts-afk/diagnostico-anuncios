<div id="resultado" style="margin-top:30px;"></div>

<script>
async function diagnosticar() {
  const data = {
    precio: Number(document.getElementById("precio").value),
    superficie: Number(document.getElementById("superficie").value),
    zona: document.getElementById("zona").value,
    fotos: Number(document.getElementById("fotos").value),
    dias: Number(document.getElementById("dias").value),
    visitas: Number(document.getElementById("visitas").value || 0),
    contactos: Number(document.getElementById("contactos").value || 0),
    descripcion: document.getElementById("descripcion").value
  };

  const res = await fetch("/clinica", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const r = await res.json();

  document.getElementById("resultado").innerHTML = `
    <h2>${r.score} / 100 — Estado: ${r.estado}</h2>
    <p><strong>${r.resumen}</strong></p>

    <h3>Fricciones detectadas</h3>
    <ul>${r.fricciones.map(f => `<li>${f}</li>`).join("")}</ul>

    <h3>Lectura profesional</h3>
    <p>${r.lecturaProfesional.join(" ")}</p>

    <p><strong>Advertencia:</strong> ${r.advertencia}</p>
    <p><strong>Siguiente paso:</strong> ${r.siguientePaso}</p>
  `;
}
</script>
