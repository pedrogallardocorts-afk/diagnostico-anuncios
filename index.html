<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diagnóstico de anuncios inmobiliarios</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      font-size: 36px;
      line-height: 1.2;
    }
    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      font-size: 16px;
      margin-top: 12px;
    }
    button {
      margin-top: 16px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #resultado {
      margin-top: 24px;
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Diagnóstico de anuncios inmobiliarios</h1>

  <p>Pega aquí el texto de tu anuncio:</p>

  <textarea id="texto"></textarea>

  <br />

  <button onclick="analizar()">Analizar anuncio</button>

  <div id="resultado"></div>

  <script>
    async function analizar() {
      const texto = document.getElementById("texto").value;
      const resultado = document.getElementById("resultado");

      resultado.innerText = "Analizando anuncio…";

      try {
        const response = await fetch(
          "https://diagnostico-anuncios-production.up.railway.app/diagnostico",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ texto })
          }
        );

        const data = await response.json();

        if (data.error) {
          resultado.innerText = "Error: " + data.error;
        } else {
          resultado.innerText = data.resultado || JSON.stringify(data, null, 2);
        }

      } catch (error) {
        resultado.innerText = "Error de conexión con el servidor";
      }
    }
  </script>

</body>
</html>
