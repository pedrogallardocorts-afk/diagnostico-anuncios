<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Diagnóstico de Anuncios Inmobiliarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #fafafa;
      margin: 0;
      padding: 32px;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #555;
      margin-bottom: 24px;
      font-size: 18px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      resize: vertical;
    }

    button {
      margin-top: 16px;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #000;
    }

    .resultado {
      margin-top: 40px;
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: none;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .bloque {
      margin-bottom: 24px;
    }

    .bloque h3 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .cta {
      margin-top: 32px;
      padding: 20px;
      background: #111;
      color: white;
      border-radius: 10px;
      font-size: 18px;
    }

    .cta strong {
      display: block;
      margin-bottom: 6px;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Diagnóstico de anuncios inmobiliarios</h1>
    <p class="subtitle">
      Analiza tu anuncio como lo haría un profesional que vende sin quemar el precio.
    </p>

    <textarea id="texto" placeholder="Pega aquí el texto de tu anuncio inmobiliario..."></textarea>
    <button onclick="analizar()">Analizar anuncio</button>

    <div id="resultado" class="resultado"></div>
  </div>

  <script>
    async function analizar() {
      const texto = document.getElementById("texto").value;
      const resultado = document.getElementById("resultado");

      if (!texto.trim()) {
        alert("Pega el texto del anuncio primero");
        return;
      }

      resultado.style.display = "block";
      resultado.innerHTML = "Analizando anuncio…";

      const res = await fetch("/diagnostico", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto })
      });

      const data = await res.json();

      const lineas = data.resultado.split("\n");
      let html = "";

      lineas.forEach(linea => {
        if (linea.startsWith("SCORE")) {
          html += `<div class="score">${linea}</div>`;
        } else if (linea.endsWith(":")) {
          html += `<div class="bloque"><h3>${linea}</h3>`;
        } else if (linea.trim() === "") {
          html += "</div>";
        } else {
          html += `<p>${linea}</p>`;
        }
      });

      html += `
        <div class="cta">
          <strong>Este anuncio puede dar mucho más.</strong>
          Si quieres una valoración profesional y una estrategia real de venta,
          el siguiente paso es hacerlo bien desde el principio.
        </div>
      `;

      resultado.innerHTML = html;
    }
  </script>
</body>
</html>
